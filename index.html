<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4b2fc9">
<meta name="description" content="Cerveau Fort : calcul mental, énigmes, logique et observation.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cerveau Fort">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cerveau Fort</title>
<style>
:root{--bg:#f3f0ff;--card:#fff;--txt:#2a1f55;--mut:#7a6fa8;--p:#6c3cf0;--ok:#22b35e;--ko:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16112e;--card:#251d4a;--txt:#f1edff;--mut:#a99fd6}}
:root[data-theme="dark"]{--bg:#16112e;--card:#251d4a;--txt:#f1edff;--mut:#a99fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--txt);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px 24px}
.scr{display:none;flex:1;flex-direction:column}.scr.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#top[hidden]{display:none}
.chip{background:var(--card);border-radius:20px;padding:8px 14px;font-weight:800;box-shadow:0 2px 0 rgba(108,60,240,.15)}
#back{background:var(--card);width:44px;height:44px;border-radius:50%;font-size:22px;font-weight:900}
.sp{flex:1}
#home{align-items:center;justify-content:center;text-align:center;gap:14px}
.brain{font-size:84px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.title{display:flex;flex-direction:column;gap:6px;align-items:center}
.title div{display:flex;gap:5px}
.title b{width:38px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:26px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.tag{color:var(--mut);margin:4px 0 14px;max-width:300px}
.big{width:100%;max-width:320px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#7c4dff,#5a2fe0);color:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 #3b1fa8}
.big.alt{background:linear-gradient(135deg,#ffb02e,#ff8a1f);box-shadow:0 5px 0 #c4640a}
.plink{display:inline-block;color:var(--txt);background:var(--card);border:2px solid var(--p);font-weight:800;text-decoration:none;padding:12px 20px;border-radius:18px;font-size:16px;margin-top:8px;box-shadow:0 3px 0 rgba(108,60,240,.25)}
.plink:active{transform:translateY(2px)}
.big:active,.c:active,.cat button:active{transform:translateY(3px)}
h2{margin:0 0 12px;font-size:24px}
.cat{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;border-left:10px solid var(--c)}
.ct{display:flex;align-items:center;gap:10px;font-size:19px;margin-bottom:10px}.ct span{font-size:30px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv button{background:var(--c);color:#fff;border-radius:14px;padding:10px 4px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv button:disabled{background:var(--mut);opacity:.45}
.lv small{font-size:15px;letter-spacing:1px}
.pb{height:12px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:6px}
#bar{height:100%;width:0;background:var(--g);transition:width .3s;border-radius:8px}
#qn{color:var(--mut);font-weight:700;margin-bottom:10px}
#qt{font-size:23px;font-weight:800;text-align:center;margin:6px 0 12px}
#vis{background:var(--card);border-radius:22px;padding:14px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:14px}
#vis:empty{display:none}
.seq{font-size:32px;font-weight:900;letter-spacing:1px}
.em{font-size:34px;line-height:1.35;word-break:break-word}
#ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border-radius:18px;padding:18px 8px;font-weight:800;font-size:20px;box-shadow:0 4px 0 rgba(108,60,240,.2);min-height:62px}
.c.ok{background:var(--ok);color:#fff}.c.ko{background:var(--ko);color:#fff}.c.off{opacity:.25;pointer-events:none}
#ch.grid{grid-template-columns:repeat(var(--n),1fr);gap:6px}
#ch.grid .c{padding:0;aspect-ratio:1;font-size:clamp(22px,8vw,34px);min-height:0}
.c.hint{animation:pl .7s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #ffb02e;transform:scale(1.06)}}
#fb{min-height:30px;text-align:center;font-weight:800;margin:14px 0 6px}
#hint{background:#ffb02e;color:#3a2600;border-radius:16px;padding:12px 18px;font-weight:800;align-self:center}
#hint:disabled{opacity:.4}
#next{margin-top:12px;align-self:center}
#next[hidden]{display:none}
.res{align-items:center;text-align:center;justify-content:center;gap:12px}
.stars{font-size:54px;letter-spacing:6px}
.rows{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.bg{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.bg .i{font-size:36px}.bg.lk{opacity:.4;filter:grayscale(1)}.bg small{color:var(--mut);display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="top" hidden>
    <button id="back" onclick="back()" aria-label="Retour">‹</button>
    <div class="sp"></div>
    <div class="chip">⭐ <span id="tp">0</span></div>
    <div class="chip">💡 <span id="th">0</span></div>
  </div>
  <section id="home" class="scr on">
    <div class="brain">🧠</div>
    <div class="title" id="logo"></div>
    <p class="tag">Calcul, énigmes, logique et observation : muscle ton cerveau en t’amusant !</p>
    <button class="big" onclick="show('menu')">▶ Jouer</button>
    <button class="big alt" onclick="show('rew')">🏆 Récompenses</button>
    <a class="plink" href="confidentialite.html">🔒 Politique de confidentialité</a>
  </section>
  <section id="menu" class="scr"><h2>Choisis un défi</h2><div id="cats"></div></section>
  <section id="game" class="scr">
    <div class="pb"><div id="bar"></div></div>
    <div id="qn"></div>
    <div id="qt"></div>
    <div id="vis"></div>
    <div id="ch"></div>
    <div id="fb"></div>
    <button id="hint" onclick="hint()">💡 Indice</button>
    <button id="next" class="big" hidden onclick="nextQ()">Suivant</button>
  </section>
  <section id="res" class="scr res">
    <div id="rs" class="stars"></div>
    <h2 id="rt"></h2>
    <div class="rows" id="rr"></div>
  </section>
  <section id="rew" class="scr"><h2>Mes récompenses</h2><div id="bl"></div><div id="gm"></div><p style="text-align:center"><a class="plink" href="confidentialite.html">🔒 Politique de confidentialité</a></p></section>
</div>
<script>
const $=s=>document.querySelector(s),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),pick=a=>a[r(0,a.length-1)];
let S={pts:0,hints:5,stars:{},badges:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("cf")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cf",JSON.stringify(S))}catch(e){}};
const C=[{id:"calc",n:"Calcul mental",e:"🧮",c:"#ef5350"},{id:"enig",n:"Énigmes",e:"🧩",c:"#f08a00"},{id:"logi",n:"Logique",e:"🔢",c:"#1ea870"},{id:"obs",n:"Observation",e:"👀",c:"#2b8cf0"}];
const B=[
{e:"🥉",n:"Apprenti",t:"Gagne 50 points",f:()=>S.pts>=50},
{e:"🥈",n:"Malin",t:"Gagne 150 points",f:()=>S.pts>=150},
{e:"🥇",n:"Champion",t:"Gagne 400 points",f:()=>S.pts>=400},
{e:"💎",n:"Génie",t:"Gagne 800 points",f:()=>S.pts>=800},
{e:"🌟",n:"Sans faute",t:"Obtiens 3 étoiles à un niveau",f:()=>Object.values(S.stars).some(v=>v>=3)},
{e:"🎒",n:"Touche-à-tout",t:"Réussis le niveau 1 de chaque défi",f:()=>C.every(c=>S.stars[c.id+1]>0)},
{e:"🏆",n:"Maître du cerveau",t:"Réussis les 12 niveaux",f:()=>C.every(c=>[1,2,3].every(l=>S.stars[c.id+l]>0))}];
const R=[[
["Je brille le jour et je me couche le soir. Qui suis-je ?","Le soleil","La lune","Une étoile","Un nuage"],
["J’ai quatre pattes, je miaule et j’aime le lait. Qui suis-je ?","Un chat","Un chien","Un lapin","Un cheval"],
["Quel animal fait « meuh » ?","La vache","Le mouton","Le cochon","La poule"],
["Bleu + jaune = quelle couleur ?","Vert","Orange","Violet","Rose"],
["Combien y a-t-il de jours dans une semaine ?","7","5","6","8"]],[
["Plus je sèche, plus je suis mouillée. Que suis-je ?","Une serviette","Une éponge","Une plante","La pluie"],
["Qu’est-ce qui monte et descend sans bouger ?","Un escalier","Un ascenseur","Un oiseau","Un ballon"],
["Je n’ai pas de voix et pourtant je réponds toujours. Qui suis-je ?","Un écho","Un perroquet","Un téléphone","Une radio"],
["Qu’est-ce qui a des dents mais ne mord jamais ?","Un peigne","Un chien","Un requin","Un cheval"],
["Combien de mois de l’année ont 28 jours ?","Tous","Un seul","Aucun","Deux"]],[
["Je t’appartiens, mais les autres s’en servent plus que toi. Qu’est-ce que c’est ?","Ton prénom","Ton lit","Ton sac","Ton stylo"],
["Plus on m’enlève, plus je deviens grand. Que suis-je ?","Un trou","Un gâteau","Un arbre","Une dette"],
["Je vole sans ailes et je pleure sans yeux. Qui suis-je ?","Un nuage","Le vent","Un avion","Une feuille"],
["Un fermier a 17 moutons. Tous sauf 9 meurent. Combien en reste-t-il ?","9","8","17","0"],
["Qu’est-ce qui remplit une pièce sans prendre de place ?","La lumière","Un meuble","Un tapis","Une table"]]];
const POOL=["🍎","🚗","🐶","⚽","🌸","🎈","🍕","🚀","🎸","🐟","🍌","⭐"];
const PAIRS=[["🐶","🐱"],["🍎","🍅"],["😀","😃"],["🌞","🌝"],["🚗","🚕"],["⭐","🌟"]];
function opts(a,d){const s=new Set([a]);for(const x of sh(d)){if(s.size>3)break;if(a+x>0)s.add(a+x)}return sh([...s]).map(String)}
const G_={
calc(l){let a,b,q,ans;
 if(l==1){a=r(2,12);b=r(2,9);if(Math.random()<.5){q=`${a} + ${b}`;ans=a+b}else{[a,b]=[Math.max(a,b),Math.min(a,b)];q=`${a} − ${b}`;ans=a-b}}
 else if(l==2){a=r(20,80);b=r(10,40);if(Math.random()<.5){q=`${a} + ${b}`;ans=a+b}else{q=`${a+b} − ${b}`;ans=a}}
 else{a=r(3,9);b=r(3,12);if(Math.random()<.65){q=`${a} × ${b}`;ans=a*b}else{q=`${a*b} ÷ ${a}`;ans=b}}
 return{q:"Calcule de tête !",vis:`<div class="seq">${q} = ?</div>`,choices:opts(ans,[-10,-2,-1,1,2,3,10]),ans:String(ans)}},
enig(l,i,qs){const x=qs[i];return{q:x[0],choices:sh(x.slice(1)),ans:x[1]}},
logi(l){let s,a;
 if(l==1){const st=r(2,5),x=r(1,10);s=[0,1,2,3].map(k=>x+k*st);a=x+4*st}
 else if(l==2){if(Math.random()<.5){const m=r(2,3),x=r(1,3);s=[0,1,2,3].map(k=>x*m**k);a=x*m**4}
  else{const p=r(1,3),q=r(4,6),x=r(1,5);s=[x,x+p,x+p+q,x+2*p+q,x+2*p+2*q];a=x+3*p+2*q}}
 else{const t=r(0,2);
  if(t==0){const x=r(1,6);s=[0,1,2,3,4].map(k=>(x+k)**2);a=(x+5)**2}
  else if(t==1){s=[r(1,3),r(1,4)];while(s.length<5)s.push(s[s.length-1]+s[s.length-2]);a=s[4]+s[3]}
  else{const x=r(1,5);s=[x,x+1,x+3,x+6,x+10];a=x+15}}
 return{q:"Quel nombre complète la suite ?",vis:`<div class="seq">${s.join(" • ")} • ?</div>`,choices:opts(a,[-3,-2,-1,1,2,3,5]),ans:String(a)}},
obs(l,i){
 if(l==1){const p=sh(pick(PAIRS)),n=i<3?3:4;return{type:"odd",q:"Touche l’intrus !",base:p[0],odd:p[1],n,idx:r(0,n*n-1)}}
 if(l==2){const e=sh(POOL).slice(0,3),c=r(3,8),arr=sh([...Array(c).fill(e[0]),...Array(r(5,9)+i).fill(0).map(()=>pick([e[1],e[2]]))]);
  return{q:`Combien de ${e[0]} vois-tu ?`,vis:`<div class="em">${arr.join(" ")}</div>`,choices:opts(c,[-2,-1,1,2,3]),ans:String(c)}}
 const n=i<2?4:5,sel=sh(POOL),mem=sel.slice(0,n),good=pick(mem),bad=sel.slice(n,n+3);
 return{q:"Quel emoji faisait partie de la liste ?",mem:mem.join(" "),choices:sh([good,...bad]),ans:good}}};
const GA={enabled:false,measurementId:"G-3GZ0HTVW69",consentKey:"cf-ga"};
let gaOn=false,gaLoaded=false;
const gaValid=()=>GA.enabled&&/^G-[A-Z0-9]{6,12}$/.test(GA.measurementId);
function loadGA(){
 window["ga-disable-"+GA.measurementId]=false;gaOn=true;
 if(gaLoaded)return;gaLoaded=true;
 window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};
 gtag("consent","default",{ad_storage:"denied",ad_user_data:"denied",ad_personalization:"denied",analytics_storage:"granted"});
 gtag("js",new Date());
 gtag("config",GA.measurementId,{allow_google_signals:false,allow_ad_personalization_signals:false,page_location:location.origin+location.pathname,page_referrer:""});
 const s=document.createElement("script");s.async=true;
 s.src="https://www.googletagmanager.com/gtag/js?id="+GA.measurementId;
 document.head.appendChild(s)}
function track(name,params){if(!gaValid()||!gaOn||!window.gtag)return;try{gtag("event",name,params||{})}catch(e){}}
function gaChoice(v){try{localStorage.setItem(GA.consentKey,v?"1":"0")}catch(e){}
 const b=document.getElementById("gacm");if(b)b.remove();
 if(v)loadGA();else{gaOn=false;window["ga-disable-"+GA.measurementId]=true}}
function askConsent(){if(!gaValid()||document.getElementById("gacm"))return;
 const d=document.createElement("div");d.id="gacm";
 d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:456px;margin:0 auto;background:var(--card);color:var(--txt);border-radius:20px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:50;font-size:15px;line-height:1.35";
 d.innerHTML='<b>Mesure d’audience anonyme</b><p style="margin:6px 0 12px">Nous comptons les parties jouées pour améliorer le jeu. Aucun nom, aucune donnée personnelle, aucune publicité. Si tu es mineur, demande l’accord d’un parent.</p><div style="display:flex;gap:8px"><button class="c" style="flex:1;min-height:0;padding:12px" onclick="gaChoice(true)">J’accepte</button><button class="c" style="flex:1;min-height:0;padding:12px" onclick="gaChoice(false)">Je refuse</button></div>';
 document.body.appendChild(d)}
function initGA(){if(!gaValid())return;let c=null;try{c=localStorage.getItem(GA.consentKey)}catch(e){}
 if(c==="1")loadGA();else if(c===null)askConsent()}
const ADS={enabled:false,publisherId:"ca-pub-XXXXXXXXXXXXXXXX",test:true,childDirected:false,minLevelsBeforeAd:2};
let adReady=false,adCount=0;
function initAds(){
 if(!ADS.enabled||!/^ca-pub-\d{16}$/.test(ADS.publisherId))return;
 window.adsbygoogle=window.adsbygoogle||[];
 window.adBreak=window.adConfig=function(o){window.adsbygoogle.push(o)};
 const s=document.createElement("script");
 s.async=true;s.crossOrigin="anonymous";
 s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADS.publisherId;
 s.setAttribute("data-ad-client",ADS.publisherId);
 if(ADS.test)s.setAttribute("data-adbreak-test","on");
 if(ADS.childDirected)s.setAttribute("data-tag-for-child-directed-treatment","1");
 document.head.appendChild(s);adReady=true;
 try{adConfig({preloadAdBreaks:"on",sound:"off"})}catch(e){}
}
function adThen(go){
 adCount++;let fired=false,started=false;
 const once=()=>{if(fired)return;fired=true;go()};
 if(!adReady||adCount<ADS.minLevelsBeforeAd||!navigator.onLine){once();return}
 const w=setTimeout(()=>{if(!started)once()},2500);
 try{adBreak({type:"next",name:"niveau_suivant",
  beforeAd(){started=true;clearTimeout(w)},
  afterAd(){},
  adBreakDone(){clearTimeout(w);once()}})}catch(e){clearTimeout(w);once()}
}
let G,cur="home";
function upd(){$("#tp").textContent=S.pts;$("#th").textContent=S.hints}
function show(id){document.querySelectorAll(".scr").forEach(e=>e.classList.remove("on"));$("#"+id).classList.add("on");cur=id;$("#top").hidden=id=="home";
 clearTimeout(G&&G.t);upd();if(id=="menu")menu();if(id=="rew")rew();scrollTo(0,0)}
function back(){show(cur=="game"||cur=="res"?"menu":cur=="menu"||cur=="rew"?"home":"home")}
function menu(){$("#cats").innerHTML=C.map(c=>`<div class="cat" style="--c:${c.c}"><div class="ct"><span>${c.e}</span><b>${c.n}</b></div><div class="lv">${[1,2,3].map(l=>{const o=l==1||S.stars[c.id+(l-1)]>0,s=S.stars[c.id+l]||0;return`<button ${o?"":"disabled"} onclick="play('${c.id}',${l})">${o?"Niveau "+l:"🔒"}<small>${"★".repeat(s)+"☆".repeat(3-s)}</small></button>`}).join("")}</div></div>`).join("")}
function rew(){$("#gm").innerHTML=gaValid()?'<button class="chip" onclick="askConsent()">Mesure d’audience : modifier mon choix</button>':"";$("#bl").innerHTML=B.map(b=>{const u=S.badges.includes(b.n);return`<div class="bg ${u?"":"lk"}"><span class="i">${b.e}</span><div><b>${b.n}</b><small>${b.t}</small></div></div>`).join("")}
function play(cat,lv){const c=C.find(x=>x.id==cat),src=cat=="enig"?sh(R[lv-1]):null;
 G={cat,lv,i:0,ok:0,pts:0,qs:[0,1,2,3,4].map(i=>G_[cat](lv,i,src)),c};
 $("#game").style.setProperty("--g",c.c);show("game");render();track("level_start",{level_name:cat+"-"+lv,category:cat,level_number:lv})}
function render(){const q=G.qs[G.i];G.done=false;G.used=false;clearTimeout(G.t);
 $("#qn").textContent=`${G.c.n} · niveau ${G.lv} · question ${G.i+1}/5`;$("#bar").style.width=G.i*20+"%";
 $("#fb").textContent="";$("#next").hidden=true;$("#qt").textContent=q.q;
 const vis=$("#vis"),ch=$("#ch");ch.innerHTML="";ch.className="";vis.innerHTML=q.vis||"";
 $("#hint").disabled=false;
 if(q.type=="odd"){ch.className="grid";ch.style.setProperty("--n",q.n);
  for(let k=0;k<q.n*q.n;k++){const b=document.createElement("button");b.className="c";b.textContent=k==q.idx?q.odd:q.base;b.onclick=()=>ans(b,k==q.idx);ch.append(b)}}
 else if(q.mem){vis.innerHTML=`<div class="em">${q.mem}</div><p>Mémorise bien… (4 secondes)</p>`;
  G.t=setTimeout(()=>{vis.innerHTML=`<div class="em">🤔</div>`;choices(q)},4000)}
 else choices(q)}
function choices(q){const ch=$("#ch");ch.className="";ch.innerHTML="";q.choices.forEach(t=>{const b=document.createElement("button");b.className="c";b.textContent=t;b.onclick=()=>ans(b,t===q.ans);ch.append(b)})}
function ans(b,ok){if(G.done)return;G.done=true;const q=G.qs[G.i],all=[...$("#ch").children];
 if(ok){b.classList.add("ok");G.ok++;const g=G.used?10:15;G.pts+=g;S.pts+=g;$("#fb").textContent=pick(["Bravo ! 🎉","Excellent ! 👏","Bien joué ! ✨"])+` +${g} points`}
 else{b.classList.add("ko");all.forEach(x=>{if(q.type=="odd"?x.textContent==q.odd:x.textContent===q.ans)x.classList.add("ok")});$("#fb").textContent="Pas tout à fait… la bonne réponse est en vert."}
 save();upd();$("#next").textContent=G.i==4?"Voir le résultat":"Suivant";$("#next").hidden=false}
function hint(){const q=G.qs[G.i];if(G.done||G.used||S.hints<1)return;const all=[...$("#ch").children];if(!all.length)return;
 G.used=true;S.hints--;save();upd();
 if(q.type=="odd")all.find(x=>x.textContent==q.odd).classList.add("hint");
 else sh(all.filter(x=>x.textContent!==q.ans)).slice(0,2).forEach(x=>x.classList.add("off"));
 $("#fb").textContent="Deux mauvaises réponses ont été retirées."}
function nextQ(){G.i++;G.i<5?render():end()}
function end(){const k=G.ok,st=k>=5?3:k>=4?2:k>=3?1:0,key=G.cat+G.lv;
 if(st>(S.stars[key]||0))S.stars[key]=st;if(st>0)S.hints++;
 const nb=[];B.forEach(b=>{if(!S.badges.includes(b.n)&&b.f()){S.badges.push(b.n);S.hints++;nb.push(b)}});save();
 $("#rs").textContent="★".repeat(st)+"☆".repeat(3-st);
 $("#rt").textContent=["Courage, tu peux y arriver !","Bien joué, niveau réussi !","Très bien !","Parfait ! Quel cerveau !"][st];
 const next=G.lv<3&&st>0;
 $("#rr").innerHTML=`<div class="chip">${k}/5 bonnes réponses · +${G.pts} points</div>${st>0?'<div class="chip">💡 +1 indice gagné</div>':""}${nb.map(b=>`<div class="chip">${b.e} Nouvelle récompense : ${b.n}</div>`).join("")}
 ${next?`<button class="big" onclick="adThen(()=>play('${G.cat}',${G.lv+1}))">Niveau suivant</button>`:""}
 <button class="big ${next?"alt":""}" onclick="adThen(()=>play('${G.cat}',${G.lv}))">Rejouer</button>
 <button class="big alt" onclick="show('menu')">Retour aux défis</button>`;
 track("level_end",{level_name:G.cat+"-"+G.lv,category:G.cat,level_number:G.lv,success:st>0,correct_answers:k,stars:st,points_gained:G.pts});
 track("post_score",{score:S.pts,level_name:G.cat+"-"+G.lv});
 show("res")}
(function(){const cols=["#ef5350","#f08a00","#1ea870","#2b8cf0","#8e5cf6","#e0489a","#f0b400"];
 $("#logo").innerHTML=["CERVEAU","FORT"].map((w,j)=>`<div>${[...w].map((c,i)=>`<b style="background:${cols[(i+j*3)%7]}">${c}</b>`).join("")}</div>`).join("")})();
upd();
initAds();
initGA();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{try{navigator.serviceWorker.register("service-worker.js").catch(()=>{})}catch(e){}})}
</script>
